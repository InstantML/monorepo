# Cloud Build config for the InstantML MCP server image.
#
# Submitted by tools/deploy-mcp.mjs and the deploy-mcp GitHub Action with
# `gcloud builds submit --config tools/cloudbuild.mcp.yaml --substitutions=_IMAGE=...`.
# Builds tools/mcp.Dockerfile (the root Dockerfile builds the Rust API instead,
# so we cannot use `gcloud builds submit --tag`, which assumes ./Dockerfile).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "tools/mcp.Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images:
  - "${_IMAGE}"
options:
  # Send build logs to Cloud Logging only so `gcloud builds submit` does not need
  # read access to the default Cloud Build GCS logs bucket.
  logging: CLOUD_LOGGING_ONLY
