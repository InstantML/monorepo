[package]
name = "rlobs-rust-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "rlobs-rust-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.7.9", features = ["macros", "json"] }
base64 = "=0.22.1"
base64ct = "=1.6.0"
chrono = { version = "=0.4.39", features = ["serde"] }
clickhouse = { version = "=0.13.2", features = ["uuid", "chrono"] }
getrandom = "=0.2.15"
home = "=0.5.9"
http = "=1.2.0"
indexmap = "=2.7.1"
mime_guess = "=2.0.5"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
sha2 = "=0.10.8"
sqlx = { version = "=0.8.3", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "time"] }
tokio-util = { version = "=0.7.17", features = ["io"] }
tower = { version = "=0.5.2", features = ["timeout"] }
tower-http = { version = "=0.6.2", features = ["compression-full", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "json"] }
url = "=2.4.1"
utoipa = "=5.3.1"
uuid = { version = "=1.11.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.10.1"
