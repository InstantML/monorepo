[package]
name = "instantml-rust-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "instantml-rust-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.7.9", features = ["macros", "json"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.39", features = ["serde"] }
clickhouse = { version = "=0.13.2", features = ["uuid", "chrono", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
getrandom = "=0.2.15"
http = "=1.2.0"
jsonwebtoken = "=9.3.1"
mime_guess = "=2.0.5"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
sha2 = "=0.10.8"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "time", "sync"] }
tokio-util = { version = "=0.7.17", features = ["io"] }
tower = { version = "=0.5.2", features = ["timeout"] }
tower-http = { version = "=0.6.2", features = ["compression-full", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "json"] }
url = "=2.4.1"
uuid = { version = "=1.11.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.10.1"
