name: Python SDK Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      repository:
        description: Package index to publish to.
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: python-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Python SDK Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Packaging Tools
        run: python -m pip install -r requirements-dev.txt

      - name: Build Wheel And Source Distribution
        run: python -m build packages/python-sdk

      - name: Check Distribution Metadata
        run: python -m twine check packages/python-sdk/dist/*

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instantml-python-sdk-dist
          path: packages/python-sdk/dist/

  publish-testpypi:
    name: Publish Python SDK To TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/instantml
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: instantml-python-sdk-dist
          path: dist/

      - name: Publish To TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish Python SDK To PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/instantml
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: instantml-python-sdk-dist
          path: dist/

      - name: Publish To PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
