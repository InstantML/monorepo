name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # paths-filter reads the PR/commit file list via the API for pull_request
  # events. Repo read is sufficient.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the monorepo a change touches so the heavy split
  # jobs only run when relevant. The aggregate `quality` gate still runs on
  # every event and stays the single required status check, so a skipped
  # split job (area untouched) never blocks a merge while a real failure
  # always does.
  #
  # Filter coupling notes (keep these honest — a wrong filter can let a
  # broken change merge because its gate was skipped):
  #   - All three codegen artifacts are committed: openapi.generated.json,
  #     apps/web/src/types/api.generated.ts, apps/docs/openapi.json.
  #   - rust_api drift-checks openapi.generated.json + api.generated.ts, so
  #     it must run on Rust source, the codegen tool, and the committed TS.
  #   - docs validates the committed public OpenAPI copy against the
  #     committed openapi.generated.json, so it must run when that spec or
  #     the docs sources / docs tooling change — not on arbitrary Rust edits.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      rust_api: ${{ steps.filter.outputs.rust_api }}
      docs: ${{ steps.filter.outputs.docs }}
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # YAML anchors (&name / *name) are expanded and flattened by
          # paths-filter, so the shared globals stay defined once.
          filters: |
            global: &global
              - '.github/workflows/ci.yml'
            npm: &npm
              - 'package.json'
              - 'package-lock.json'
            rust:
              - *global
              - 'apps/rust-server/**'
            rust_api:
              - *global
              - *npm
              - 'apps/rust-server/**'
              - 'apps/web/src/types/api.generated.ts'
              - 'tools/codegen-api.mjs'
            docs:
              - *global
              - *npm
              - 'apps/docs/**'
              - 'apps/rust-server/openapi.generated.json'
              - 'tools/sync-docs-openapi.mjs'
              - 'tools/validate-docs-content.mjs'
              - 'tools/validate-docs-snippets.mjs'
              - 'tools/tests/docs-openapi.test.js'
              - 'tools/tests/benchmark-docs.test.js'
              - 'tools/tests/docs-screenshots.test.js'
              - 'apps/web/tests/docs-route.test.js'
            node:
              - *global
              - *npm
              - 'apps/server/**'
              - 'apps/web/**'
              - 'apps/admin/**'
            python:
              - *global
              - 'apps/api/**'
              - 'packages/python-sdk/**'
              - 'examples/rl-cartpole/**'
              - 'examples/q-learning-gridworld/**'
              - 'examples/contextual-bandit/**'
              - 'examples/supervised-regression/**'
              - 'examples/iris-classification/**'
              - 'pyproject.toml'
              - 'requirements-dev.txt'

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Rust Format Check
        run: cargo fmt --manifest-path apps/rust-server/Cargo.toml --all -- --check

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/rust-server/target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust Lint
        run: cargo clippy --manifest-path apps/rust-server/Cargo.toml --all-targets -- -D warnings

  rust-tests-api:
    name: Rust Tests / API Drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ needs.changes.outputs.rust_api == 'true' }}

    # Postgres for the control-plane `#[sqlx::test]` tests, which provision an
    # isolated database per test. Without DATABASE_URL these tests cannot run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The control-plane Postgres deps enlarged the Rust target dir enough to
      # exhaust the ~14 GB runner during the build ("No space left on device").
      # Drop preinstalled toolchains we don't use to reclaim ~20+ GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/rust-server/target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Rust Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/control
        run: cargo test --manifest-path apps/rust-server/Cargo.toml

      - name: Verify OpenAPI / TS Codegen Has No Drift
        # Re-runs `cargo run -- emit-openapi` and `openapi-typescript`, then
        # `git diff --exit-code` on the regenerated artifacts. Fails the
        # build if a PR changed a Rust handler or domain type without
        # committing the regenerated files. Run `npm run codegen:api` and
        # commit the diff to fix.
        run: npm run verify:api-types

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate Public Docs
        # Checks that the Mintlify source builds, the filtered public OpenAPI
        # copy is current, and public docs do not link into internal planning
        # docs. Run `npm run docs:sync-openapi` and commit the diff to fix
        # OpenAPI drift.
        run: npm run docs:test && npm run docs:validate

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Node Tests
        run: npm run test:node

  python-sdk:
    name: Python Tests / SDK Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python Tests
        run: python3 -m pytest

      - name: Python SDK Package Build
        run: |
          python3 -m build packages/python-sdk
          python3 -m twine check packages/python-sdk/dist/*
          python3 -m pip install --force-reinstall packages/python-sdk/dist/instantml-*.whl
          python3 -c "import instantml as im; print(im.Client())"

  quality:
    name: Stable Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - rust-format
      - rust-lint
      - rust-tests-api
      - docs
      - node-tests
      - python-sdk
    # Always runs so this stays the single required status check and the
    # deploy gate's `ci.yml` success lookup keeps working, even when some
    # split jobs were skipped because their area was untouched.
    if: ${{ always() }}

    steps:
      - name: Fail If A Split Gate Failed
        # `skipped` means path filtering decided the area was not affected by
        # this change — that is a pass, not a gate failure. Only a real
        # `failure` or `cancelled` (including the changes detector itself)
        # fails the aggregate gate.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more split CI gates failed: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Confirm Split Gates Passed
        run: echo "All split CI gates passed (skipped = area not touched by this change)."
