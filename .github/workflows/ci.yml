name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Stable Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/rust-server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Rust Format Check
        run: cargo fmt --manifest-path apps/rust-server/Cargo.toml --all -- --check

      - name: Rust Lint
        run: npm run rust:lint

      - name: Rust Tests
        run: npm run rust:test

      - name: Node Tests
        run: npm run test:node

      - name: Python Tests
        run: npm run test:python
