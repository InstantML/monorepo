name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Rust Format Check
        run: cargo fmt --manifest-path apps/rust-server/Cargo.toml --all -- --check

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/rust-server/target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust Lint
        run: cargo clippy --manifest-path apps/rust-server/Cargo.toml --all-targets -- -D warnings

  rust-tests-api:
    name: Rust Tests / API Drift
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Postgres for the control-plane `#[sqlx::test]` tests, which provision an
    # isolated database per test. Without DATABASE_URL these tests cannot run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The control-plane Postgres deps enlarged the Rust target dir enough to
      # exhaust the ~14 GB runner during the build ("No space left on device").
      # Drop preinstalled toolchains we don't use to reclaim ~20+ GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/rust-server/target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Rust Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/control
        run: cargo test --manifest-path apps/rust-server/Cargo.toml

      - name: Verify OpenAPI / TS Codegen Has No Drift
        # Re-runs `cargo run -- emit-openapi` and `openapi-typescript`, then
        # `git diff --exit-code` on the regenerated artifacts. Fails the
        # build if a PR changed a Rust handler or domain type without
        # committing the regenerated files. Run `npm run codegen:api` and
        # commit the diff to fix.
        run: npm run verify:api-types

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate Public Docs
        # Checks that the Mintlify source builds, the filtered public OpenAPI
        # copy is current, and public docs do not link into internal planning
        # docs. Run `npm run docs:sync-openapi` and commit the diff to fix
        # OpenAPI drift.
        run: npm run docs:validate

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Node Tests
        run: npm run test:node

  python-sdk:
    name: Python Tests / SDK Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python Tests
        run: python3 -m pytest

      - name: Python SDK Package Build
        run: |
          python3 -m build packages/python-sdk
          python3 -m twine check packages/python-sdk/dist/*
          python3 -m pip install --force-reinstall packages/python-sdk/dist/instantml-*.whl
          python3 -c "import instantml as im; print(im.Client())"

  quality:
    name: Stable Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - rust-format
      - rust-lint
      - rust-tests-api
      - docs
      - node-tests
      - python-sdk
    if: ${{ always() }}

    steps:
      - name: Fail If A Split Gate Failed
        if: ${{ contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled') || contains(join(needs.*.result, ','), 'skipped') }}
        run: |
          echo "One or more split CI gates failed: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Confirm Split Gates Passed
        run: echo "All split CI gates passed."
