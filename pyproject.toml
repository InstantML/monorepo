[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/python-sdk/tests",
  "examples/rl-cartpole/tests",
  "examples/q-learning-gridworld/tests",
  "examples/contextual-bandit/tests",
  "examples/supervised-regression/tests",
  "examples/iris-classification/tests",
]
pythonpath = [
  "apps/api",
  "packages/python-sdk",
  "examples/rl-cartpole",
  "examples/q-learning-gridworld",
  "examples/contextual-bandit",
  "examples/supervised-regression",
  "examples/iris-classification",
]
addopts = """
  -q
  --cov=apps/api/instantml_api
  --cov=packages/python-sdk/instantml
  --cov=examples/rl-cartpole
  --cov=examples/q-learning-gridworld
  --cov=examples/contextual-bandit
  --cov=examples/supervised-regression
  --cov=examples/iris-classification
  --cov-report=term-missing
  --cov-fail-under=100
"""
