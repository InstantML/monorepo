services:
  # Control-plane system of record (users/orgs/sessions/keys/billing/routes).
  # The hosted control/data services and the Rust test suite (`#[sqlx::test]`)
  # connect here via DATABASE_URL.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instantml
      POSTGRES_PASSWORD: instantml
      POSTGRES_DB: control
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantml -d control"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - instantml-postgres:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: instantml
      CLICKHOUSE_USER: instantml
      CLICKHOUSE_PASSWORD: instantml
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - instantml-clickhouse:/var/lib/clickhouse

  instantml:
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - instantml-artifacts:/data/artifacts
    environment:
      CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      INSTANTML_BIND_ADDR: 0.0.0.0:8000
      INSTANTML_AUTH_MODE: local
      INSTANTML_SERVICE_PLANE: combined
      INSTANTML_ARTIFACT_ROOT: /data/artifacts
      INSTANTML_LOG_FORMAT: json

  instantml-control:
    profiles: ["split"]
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - instantml-artifacts:/data/artifacts
    environment:
      CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      INSTANTML_TENANT_CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      DATABASE_URL: postgres://instantml:instantml@postgres:5432/control
      INSTANTML_BIND_ADDR: 0.0.0.0:8000
      INSTANTML_AUTH_MODE: local
      INSTANTML_DEV_AUTH_ENABLED: "true"
      INSTANTML_SERVICE_PLANE: control
      INSTANTML_HOSTED_CLICKHOUSE_ENABLED: "true"
      INSTANTML_CLICKHOUSE_PROVISIONER: database
      INSTANTML_ALLOWED_FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8001,http://localhost:8002
      INSTANTML_ARTIFACT_ROOT: /data/artifacts
      INSTANTML_ARTIFACT_UPLOADS_ENABLED: "false"
      INSTANTML_LOG_FORMAT: json

  instantml-data:
    profiles: ["split"]
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - instantml-artifacts:/data/artifacts
    environment:
      CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      INSTANTML_TENANT_CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      DATABASE_URL: postgres://instantml:instantml@postgres:5432/control
      INSTANTML_BIND_ADDR: 0.0.0.0:8000
      INSTANTML_AUTH_MODE: local
      INSTANTML_SERVICE_PLANE: data
      INSTANTML_CELL_ID: local-us-central1-a
      INSTANTML_HOSTED_CLICKHOUSE_ENABLED: "true"
      INSTANTML_CLICKHOUSE_PROVISIONER: database
      INSTANTML_ALLOWED_FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8001,http://localhost:8002
      INSTANTML_ARTIFACT_ROOT: /data/artifacts
      INSTANTML_ARTIFACT_UPLOADS_ENABLED: "false"
      INSTANTML_LOG_FORMAT: json

volumes:
  instantml-clickhouse:
  instantml-artifacts:
  instantml-postgres:
