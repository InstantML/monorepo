services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: instantml
      CLICKHOUSE_USER: instantml
      CLICKHOUSE_PASSWORD: instantml
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - instantml-clickhouse:/var/lib/clickhouse

  instantml:
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - instantml-artifacts:/data/artifacts
    environment:
      CLICKHOUSE_URL: http://instantml:instantml@clickhouse:8123/instantml
      INSTANTML_BIND_ADDR: 0.0.0.0:8000
      INSTANTML_AUTH_MODE: local
      INSTANTML_ARTIFACT_ROOT: /data/artifacts
      INSTANTML_LOG_FORMAT: json

volumes:
  instantml-clickhouse:
  instantml-artifacts:
