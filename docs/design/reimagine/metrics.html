<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrics · InstantML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Spline+Sans+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .mtree { font-family: var(--font-mono); font-size: 12px; }
  .mtree__ns {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    color: var(--text-dim);
    font-size: 10px; letter-spacing: var(--track-micro); text-transform: uppercase;
    border-bottom: 1px solid var(--line-hair);
    user-select: none;
  }
  .mtree__ns .n { margin-left: auto; color: var(--text-faint); }
  .mtree__leaf {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 24px;
    color: var(--text-mid);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.1s;
  }
  .mtree__leaf:hover { color: var(--text-hi); background: var(--bg-panel-raised); }
  .mtree__leaf.is-active {
    color: var(--signal);
    background: linear-gradient(90deg, var(--signal-dim), transparent 80%);
    border-left-color: var(--signal);
  }
  .mtree__leaf .sp { margin-left: auto; opacity: 0.7; }
  .smooth-ctl { display: flex; align-items: center; gap: 8px; }
  .smooth-ctl input[type="range"] {
    appearance: none; width: 90px; height: 2px;
    background: var(--line-strong); border-radius: 2px; outline: none;
  }
  .smooth-ctl input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 10px; height: 10px; border-radius: 50%;
    background: var(--signal); cursor: pointer;
    box-shadow: 0 0 6px rgba(43, 224, 130, 0.6);
  }
  .eye { cursor: pointer; color: var(--text-dim); }
  .eye:hover { color: var(--text-hi); }
  .eye.is-off { color: var(--text-faint); text-decoration: line-through; }
</style>
</head>
<body data-page="metrics">
<div class="shell">
  <header class="ticker"></header>
  <nav class="rail" aria-label="Primary"></nav>

  <main class="main">
    <div class="page-head rise">
      <div>
        <div class="page-head__crumb mlabel">instantml<span class="sep">/</span>atlas-rl</div>
        <h1>Metrics</h1>
      </div>
      <div class="page-head__actions">
        <span class="mlabel" style="letter-spacing:.08em">5 runs pinned</span>
        <button class="btn">Pin runs</button>
        <button class="btn btn--primary">Save panel to report</button>
      </div>
    </div>

    <div class="grid">
      <!-- metric browser -->
      <div class="panel col-3 rise" style="align-self:start">
        <div class="panel__head"><span class="mlabel">Metric browser</span><span class="panel__unit">214</span></div>
        <div style="padding:8px 12px;border-bottom:1px solid var(--line-hair)">
          <input class="input" style="width:100%" placeholder="Search  /  to focus" aria-label="Search metrics">
        </div>
        <div class="mtree">
          <div class="mtree__ns">▾ eval <span class="n">12</span></div>
          <div class="mtree__leaf is-active">return_mean <span class="sp">●</span></div>
          <div class="mtree__leaf">return_p95</div>
          <div class="mtree__leaf">success_rate</div>
          <div class="mtree__leaf">episode_len</div>
          <div class="mtree__ns">▾ train <span class="n">38</span></div>
          <div class="mtree__leaf">loss</div>
          <div class="mtree__leaf">kl_div</div>
          <div class="mtree__leaf">grad_norm</div>
          <div class="mtree__leaf">entropy</div>
          <div class="mtree__leaf">clip_frac</div>
          <div class="mtree__ns">▸ rollout <span class="n">24</span></div>
          <div class="mtree__ns">▸ sys <span class="n">140</span></div>
        </div>
      </div>

      <!-- main chart area -->
      <div class="col-9" style="display:flex;flex-direction:column;gap:12px">
        <div class="panel rise">
          <div class="panel__head">
            <span class="mlabel">eval/return_mean · 5 runs</span>
            <div class="smooth-ctl">
              <span class="mlabel" style="letter-spacing:.08em">Smooth</span>
              <input type="range" min="0" max="100" value="55" aria-label="Smoothing">
              <span class="mono" style="font-size:10px;color:var(--text-dim)">.55</span>
            </div>
            <div class="seg" role="group" aria-label="X axis">
              <button class="is-active">Step</button><button>Time</button>
            </div>
            <div class="seg" role="group" aria-label="Y scale">
              <button class="is-active">Lin</button><button>Log</button>
            </div>
            <button class="btn btn--ghost" style="height:22px">⤓ SVG</button>
          </div>
          <div class="panel__body panel__body--chart">
            <div class="chart-host" id="ch-main"></div>
            <div style="margin-top:8px;padding-left:50px;padding-right:10px">
              <div class="chart-host" id="ch-scrub" aria-label="Step range selector, window 22k to 31k"></div>
            </div>
          </div>
        </div>

        <!-- legend table -->
        <div class="panel rise">
          <div class="panel__head"><span class="mlabel">Series</span><span class="panel__unit">window 22k – 31k</span></div>
          <div class="panel__body panel__body--flush" style="overflow-x:auto">
            <table class="dtable" id="legend-table">
              <thead><tr>
                <th style="width:32px"></th>
                <th>Run</th>
                <th style="text-align:right">Last</th>
                <th style="text-align:right">Min</th>
                <th style="text-align:right">Max</th>
                <th style="text-align:right">Best @ step</th>
                <th style="text-align:right">Points</th>
                <th style="width:40px"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  const root = getComputedStyle(document.documentElement);
  const palette = ["--s1","--s2","--s3","--s4","--s5"].map(v => root.getPropertyValue(v).trim());
  const picked = IM.RUNS.filter(r => r.ret > 0).slice(0, 5);

  const hiddenIdx = 4;   // rlhf-040 toggled off in the legend
  const series = picked.map((r, i) => ({
    name: r.name,
    color: palette[i],
    points: IM.curvesFor(r).ret,
    live: r.status === "running" && i < 2,
  }));

  Charts.line(document.getElementById("ch-main"), {
    series: series.filter((_, i) => i !== hiddenIdx),
    height: 320, smooth: 0.55,
  });
  Charts.scrub(document.getElementById("ch-scrub"), series[0].points, { window: [0.7, 1], height: 42 });

  document.querySelector("#legend-table tbody").innerHTML = picked.map((r, i) => {
    const pts = IM.curvesFor(r).ret.map(p => p[1]);
    const max = Math.max(...pts), min = Math.min(...pts);
    const bestStep = IM.curvesFor(r).ret[pts.indexOf(max)][0];
    return `<tr>
      <td><i style="display:inline-block;width:10px;height:3px;background:${palette[i]};border-radius:1px"></i></td>
      <td class="td-name">${r.name}${r.status === "running" ? ' <span class="chip chip--live" style="height:16px;margin-left:6px">live</span>' : ""}</td>
      <td class="td-num" style="color:var(--text-hi)">${pts[pts.length-1].toFixed(1)}</td>
      <td class="td-num">${min.toFixed(1)}</td>
      <td class="td-num ${max > 470 ? "is-best" : ""}">${max.toFixed(1)}</td>
      <td class="td-num">${Charts.FMT.si(bestStep)}</td>
      <td class="td-num td-dim">${pts.length}</td>
      <td style="text-align:center"><button class="eye ${i === 4 ? "is-off" : ""}" style="background:none;border:0;font-size:13px" aria-label="${i === 4 ? "Show" : "Hide"} ${r.name}" aria-pressed="${i !== 4}">${i === 4 ? "◌" : "◉"}</button></td>
    </tr>`;
  }).join("");
})();
</script>
</body>
</html>
