[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "instantml"
version = "0.1.0"
description = "InstantML — fast, cheap experiment tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
instantml = "instantml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instantml*"]
